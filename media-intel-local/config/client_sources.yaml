xhs:
  # 跟踪账号时，只填小红书 user_id；示例默认关闭，避免没有登录态时误跑。
  - user_id: example_xhs_user_id
    enabled: false

  # 关键词监控也保留，方便当前链路继续验证。
  - id: xhs_real_example
    name: 真实小红书关键词示例
    keyword: 退役军人
    enabled: true

douyin:
  # 跟踪账号时，只填抖音 sec_user_id 或主页链接；示例默认关闭。
  - user_id: example_douyin_sec_user_id
    enabled: false

  # 关键词监控也保留，方便当前链路继续验证。
  - id: dy_keyword_veteran
    name: 抖音关键词-退役军人
    keyword: 退役军人
